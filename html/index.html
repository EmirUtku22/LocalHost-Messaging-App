<!doctype html>
<html lang="en" spellcheck="false">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

        <title>LMS App</title>
        <link rel="stylesheet" href="../css/index.html.css">
    </head>

    <body>
        <!-- The Panel That Lets You See Your ID -->
        <div class="id-container">
            <h4>Your ID Will Show Up When It's Ready</h4>

            <p class="id-display">{}</p> <!-- It's Gonna Fill Via JavaScript -->
        </div>

        <!-- Connection to Other User (you also can see user's name here) -->
        <div class="connection-container">
            <p class="connected-user">You're Not Connected</p>

            <!-- After You Press The Button, An Window.Prompt will Show Up And Ask You The Other User's ID -->
            <button class="connect-to-user">Connect To User</button>
        </div>

        <!-- Inbox -->
        <div class="inbox"></div>
    </body>
</html>
